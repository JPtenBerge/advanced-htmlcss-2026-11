<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .ding {
        width: 100px;
        height: 100px;
        background: lightgreen;
        /* transition: all 200ms ease; */
        transition: all 1s cubic-bezier(0.11, 0.92, 0.41, 1);
        opacity: 0.5;
        &:hover {
          width: 500px;
          height: 300px;
          background: lightblue;
          opacity: 1;
        }
      }
      @keyframes blinkert {
        from {
          opacity: 0;
          font-size: 100%;
          color: black;
        }
        to {
          opacity: 1;
          font-size: 300%;
          color: red;
        }
      }
      @keyframes spin {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
      }
      body {
        animation: spin 2s infinite linear;
      }

      blink {
        animation: blinkert 1s infinite alternate-reverse
          cubic-bezier(0.11, 0.92, 0.41, 1);
      }
    </style>
  </head>
  <body>
    <blink>hier de blinkert</blink>

    <div class="ding"></div>
  </body>
</html>
